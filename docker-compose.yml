# Local development against PostgreSQL.
#
# Production is Scaleway Serverless — see docs/scaleway-setup.md. There is no
# compose file for it on purpose: the deployed topology is a Serverless
# Container plus two Serverless Jobs, and a compose file pretending otherwise
# would drift out of date the first time someone changed the real thing.
#
# For the fastest loop, skip this entirely: `python manage.py runserver` uses
# SQLite with no services at all. Use this stack when you need PostgreSQL —
# which the row-locking tests in tests/test_capacity_race.py require.
name: extralessons

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: extralessons
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d extralessons"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/extralessons
      DEBUGPY: ${DEBUGPY:-0}
    volumes:
      - .:/app
      - media:/app/media
    ports:
      - "8000:8000"
      - "5678:5678"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             if [ \"$$DEBUGPY\" = \"1\" ]; then
               python -m debugpy --listen 0.0.0.0:5678 manage.py runserver 0.0.0.0:8000;
             else
               python manage.py runserver 0.0.0.0:8000;
             fi"

  # Mirrors the Scaleway notifier Job, but as a daemon so local changes take
  # effect immediately. In production this is `run_notifier --drain` on a cron.
  notifier:
    build:
      context: .
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/extralessons
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: python manage.py run_notifier

volumes:
  pgdata:
  media:
