{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="auth-box panel">
  <h1>Change your password</h1>
  <p class="muted small">You're logged in as {{ user.email }}, so there's no need to type your current password — just choose a new one.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Save new password</button>
  </form>
</div>
{% endblock %}
