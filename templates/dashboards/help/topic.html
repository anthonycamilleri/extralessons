{% extends base_template %}
{% block title %}{{ topic.title }} · Help{% endblock %}
{% block content %}
<a class="back-link" href="{% url 'provider_help_index' %}">← All help</a>
{# The guide carries its own <h1>. #}
<article class="help-article panel">
  {{ body }}
</article>

<nav class="help-more" aria-label="More help">
  <h2>More help</h2>
  <ul class="plain">
    {% for other in siblings %}
    <li><a href="{% url audience.url_name other.slug %}">{{ other.title }}</a>
      <span class="muted small">— {{ other.summary }}</span></li>
    {% endfor %}
  </ul>
</nav>
{% endblock %}
