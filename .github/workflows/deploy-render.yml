name: Deploy to Render

# Render builds the image from the Dockerfile itself, runs the migrations as
# the web service's pre-deploy command, and only switches traffic once the new
# version answers /_health. What this workflow adds is the *when*: a deploy
# happens only after CI has passed on the commit, and a rollback is a re-run
# of this workflow with an earlier commit.
#
# Only the web service is deployed here. Render's API has no deploy trigger
# for cron jobs, so the notifier uses Render's own "checksPass" trigger in
# render.yaml and deploys itself once CI is green on main. It runs nothing
# until its nightly tick, so it never meets an unmigrated schema.
#
# Render's "checksPass" trigger would do the web service too, with no
# workflow at all; see the note at the top of render.yaml.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit to deploy. Defaults to the head of main; give an earlier SHA to roll back."
        required: false
        type: string

# Never let two deploys interleave: a pre-deploy migration is not safe to run
# twice concurrently, and the second deploy would race the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires for every CI conclusion; only a green one deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # A hard stop above the deploy script's own 30-minute limit, so a hung
    # step can never hold the deploy-production concurrency group for hours.
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      # The service name from render.yaml. Its id is looked up from this at
      # run time, so the only configuration GitHub needs is the API key.
      WEB_SERVICE_NAME: extralessons-web
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration is present
        # Failing here with a readable message beats a 401 from the API
        # halfway through. See docs/render-setup.md.
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Missing repository secret RENDER_API_KEY."
            echo "Create one under Render → Account settings → API Keys and add it"
            echo "under Settings → Secrets and variables → Actions (or run"
            echo "deploy/render-github-config.sh)."
            exit 1
          fi

      - name: Resolve the Render web service
        id: render
        # Repository variables, when set, are honoured as overrides; otherwise
        # the id and the site URL come from the Render API by service name.
        env:
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          web="${RENDER_WEB_SERVICE_ID:-$(deploy/render-service-id.sh "$WEB_SERVICE_NAME")}"
          url="${APP_URL:-$(deploy/render-service-id.sh --url "$WEB_SERVICE_NAME")}"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "web service: $web"
          echo "site:        ${url:-<unknown, smoke test skipped>}"

      - name: Resolve the commit to deploy
        id: commit
        # On a workflow_run event github.sha is the head of the default branch
        # at the time the event fired, which is not necessarily the commit CI
        # just tested; head_sha is.
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ inputs.commit_sha || github.sha }}"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $sha"

      - name: Deploy the web service (runs migrations first)
        run: deploy/render-deploy.sh "${{ steps.render.outputs.web }}" "${{ steps.commit.outputs.sha }}"

      - name: Smoke test
        if: ${{ steps.render.outputs.url != '' }}
        env:
          APP_URL: ${{ steps.render.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$APP_URL/_health" || true)
            [ "$code" = "200" ] && { echo "health ok"; exit 0; }
            echo "attempt $attempt: HTTP $code"
            sleep 5
          done
          echo "::error::$APP_URL/_health never returned 200."
          exit 1
