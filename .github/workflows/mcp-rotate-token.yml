name: "MCP: rotate the API token"

# Sets MCP_API_TOKEN on the web container to the value held in the
# MCP_API_TOKEN secret, then proves the endpoint accepts it.
#
# Why this exists: Scaleway stores secret environment variables hashed and
# never returns them, so a token nobody wrote down cannot be read back off the
# container — only replaced. When the connector and the container disagree,
# every call is a 401 and no connector setting can tell you which side is
# wrong. Rotating to a known value is the only way back.
#
# Only MCP_API_TOKEN is written. `secret-environment-variables.*` merges on
# update (deploy/scaleway-env.lib.sh), so SECRET_KEY, DATABASE_URL and the
# ZeptoMail token are left alone -- unlike the plain map, which replaces
# wholesale. Updating the container starts a new deployment, so expect one
# cold start.
#
# Dispatch only: a push that touches this file registers the workflow with
# GitHub without running it.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "rotate" to confirm writing to production'
        required: true
        type: string
      base_url:
        description: "Site to verify afterwards"
        type: string
        default: "https://www.esljparents.eu"
  push:
    paths: [".github/workflows/mcp-rotate-token.yml"]

permissions:
  contents: read

jobs:
  rotate:
    if: github.event_name == 'workflow_dispatch'
    name: Rotate and verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: fr-par
      CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
      TOKEN: ${{ secrets.MCP_API_TOKEN }}
    steps:
      - name: Refuse anything but a deliberate, well-formed rotation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -u
          [ "$CONFIRM" = "rotate" ] || { echo "::error::type 'rotate' to confirm"; exit 1; }
          [ -n "$CONTAINER_ID" ] || { echo "::error::vars.SCW_CONTAINER_ID is unset"; exit 1; }
          [ -n "${TOKEN:-}" ] || { echo "::error::secrets.MCP_API_TOKEN is empty"; exit 1; }
          # An empty token switches the endpoint off (404) and a short one is
          # not worth the trust this token carries: it can publish classes.
          if [ "${#TOKEN}" -lt 24 ]; then
            echo "::error::the token is only ${#TOKEN} characters; use at least 24"
            echo "::error::(deploy/provision.sh generates 36 bytes of urlsafe base64)"
            exit 1
          fi
          case "$TOKEN" in
            *[[:space:]]*) echo "::error::the token contains whitespace; re-add the secret without it"; exit 1 ;;
          esac
          echo "token looks well formed (${#TOKEN} characters)"

      - name: Install the Scaleway CLI
        run: curl -sS https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sudo sh

      - name: Write MCP_API_TOKEN to the container
        run: |
          set -euo pipefail
          echo "::add-mask::$TOKEN"
          before="$(scw container container get "$CONTAINER_ID" -o json | jq -r '.status')"
          echo "status before: $before"
          # One key only; the rest of the secret map is preserved by the merge.
          scw container container update "$CONTAINER_ID" \
            secret-environment-variables.MCP_API_TOKEN="$TOKEN" -o json \
            | jq -r '"status after update: \(.status)"'

      - name: Wait for the new deployment
        run: |
          set -u
          for i in $(seq 1 40); do
            s="$(scw container container get "$CONTAINER_ID" -o json | jq -r '.status')"
            case "$s" in
              ready)  echo "ready after ${i} check(s)"; exit 0 ;;
              error)  echo "::error::container went to status=error"; exit 1 ;;
              *)      echo "  status=$s"; sleep 10 ;;
            esac
          done
          echo "::error::container did not become ready within ~7 minutes"
          exit 1

      - name: Verify the endpoint now accepts the token
        env:
          BASE: ${{ inputs.base_url || 'https://www.esljparents.eu' }}
        run: |
          set -u
          echo "::add-mask::$TOKEN"
          BASE="${BASE%/}"
          body='{"jsonrpc":"2.0","id":1,"method":"ping"}'
          code() { # code HEADER... -> status
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$BASE/mcp" \
              -H 'Content-Type: application/json' "$@" -d "$body" || echo 000
          }
          fails=0
          # A cold start can lose the first request; retry each check briefly.
          check() { # check LABEL WANT HEADER...
            local label="$1" want="$2"; shift 2
            local got=""
            for _ in 1 2 3; do
              got="$(code "$@")"
              [ "$got" = "$want" ] && break
              sleep 5
            done
            if [ "$got" = "$want" ]; then
              printf '  ✓ %-26s -> %s\n' "$label" "$got"
            else
              printf '  ✗ %-26s -> %s (wanted %s)\n' "$label" "$got" "$want"
              fails=$((fails+1))
            fi
          }
          check "X-API-Key"          200 -H "X-API-Key: $TOKEN"
          check "Authorization Bearer" 200 -H "Authorization: Bearer $TOKEN"
          check "anonymous"          401
          echo
          if [ "$fails" -ne 0 ]; then
            echo "::error::$fails check(s) failed; the token was written but is not being accepted"
            exit 1
          fi
          echo "### MCP token rotated and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "The endpoint accepts the new token. Put the same value in the" >> "$GITHUB_STEP_SUMMARY"
          echo "connector as the \`X-API-Key\` request header, with Authentication = None." >> "$GITHUB_STEP_SUMMARY"
