name: "Scaleway: restore the container secrets"

# Repairs the container's secret environment after an update that passed a
# single key and replaced the whole map.
#
# deploy/scaleway-env.lib.sh says `secret-environment-variables.*` merges and
# that keys not mentioned are kept. It does not: an update passing only
# MCP_API_TOKEN left the container with that one secret and dropped
# SECRET_KEY, DATABASE_URL and ZEPTOMAIL_SEND_MAIL_TOKEN. A warm instance goes
# on serving with the environment it started with, so the damage is invisible
# until the next cold start, when Django comes up with no database.
#
# The three lost values are recoverable because the jobs carry them as plain
# variables -- there is no secret-env equivalent on `jobs definition` -- so
# this reads them back from the migrate job and writes all four secrets to the
# container in one update, then proves the site and the endpoint both work.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "restore" to confirm'
        required: true
        type: string
      base_url:
        description: "Site to verify afterwards"
        type: string
        default: "https://www.esljparents.eu"
  push:
    paths: [".github/workflows/mcp-restore-secrets.yml"]

permissions:
  contents: read

jobs:
  restore:
    if: github.event_name == 'workflow_dispatch'
    name: Restore and verify
    runs-on: ubuntu-latest
    environment: production
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: fr-par
      CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
      JOB_MIGRATE_ID: ${{ vars.SCW_JOB_MIGRATE_ID }}
      JOB_NOTIFIER_ID: ${{ vars.SCW_JOB_NOTIFIER_ID }}
      TOKEN: ${{ secrets.MCP_API_TOKEN }}
    steps:
      - name: Confirm
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -u
          [ "$CONFIRM" = "restore" ] || { echo "::error::type 'restore' to confirm"; exit 1; }
          for n in CONTAINER_ID JOB_MIGRATE_ID; do
            [ -n "${!n}" ] || { echo "::error::vars.SCW_$n is unset"; exit 1; }
          done

      - name: Install the Scaleway CLI
        run: curl -sS https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sudo sh

      - name: How many secrets the container has now
        run: |
          set -u
          echo "before: $(scw container container get "$CONTAINER_ID" -o json \
            | jq -r '(.secret_environment_variables // []) | length') secret(s)"

      - name: Recover the three lost values from the migrate job
        id: recover
        run: |
          set -euo pipefail
          jdef="$(scw jobs definition get "$JOB_MIGRATE_ID" -o json)"
          for k in SECRET_KEY DATABASE_URL ZEPTOMAIL_SEND_MAIL_TOKEN; do
            v="$(jq -r --arg k "$k" '.environment_variables[$k] // empty' <<<"$jdef")"
            if [ -z "$v" ] && [ -n "${JOB_NOTIFIER_ID:-}" ]; then
              # The notifier carries the same three; try it before giving up.
              v="$(scw jobs definition get "$JOB_NOTIFIER_ID" -o json \
                | jq -r --arg k "$k" '.environment_variables[$k] // empty')"
            fi
            [ -n "$v" ] || { echo "::error::neither job carries $k; it cannot be recovered here"; exit 1; }
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_OUTPUT"
            echo "recovered $k (${#v} characters)"
          done

      - name: Write all four secrets in one update
        env:
          SECRET_KEY: ${{ steps.recover.outputs.SECRET_KEY }}
          DATABASE_URL: ${{ steps.recover.outputs.DATABASE_URL }}
          ZEPTOMAIL_SEND_MAIL_TOKEN: ${{ steps.recover.outputs.ZEPTOMAIL_SEND_MAIL_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${TOKEN:-}" ] || { echo "::error::secrets.MCP_API_TOKEN is empty"; exit 1; }
          # Every key together, because the map is replaced wholesale.
          scw container container update "$CONTAINER_ID" \
            secret-environment-variables.SECRET_KEY="$SECRET_KEY" \
            secret-environment-variables.DATABASE_URL="$DATABASE_URL" \
            secret-environment-variables.ZEPTOMAIL_SEND_MAIL_TOKEN="$ZEPTOMAIL_SEND_MAIL_TOKEN" \
            secret-environment-variables.MCP_API_TOKEN="$TOKEN" -o json \
            | jq -r '"status after update: \(.status)"'

      - name: Wait for the new deployment
        run: |
          set -u
          for i in $(seq 1 40); do
            s="$(scw container container get "$CONTAINER_ID" -o json | jq -r '.status')"
            case "$s" in
              ready) echo "ready after ${i} check(s)"; exit 0 ;;
              error) echo "::error::container went to status=error"; exit 1 ;;
              *)     echo "  status=$s"; sleep 10 ;;
            esac
          done
          echo "::error::container did not become ready in time"; exit 1

      - name: Prove the site and the endpoint both work
        env:
          BASE: ${{ inputs.base_url || 'https://www.esljparents.eu' }}
        run: |
          set -u
          echo "::add-mask::$TOKEN"
          BASE="${BASE%/}"
          n="$(scw container container get "$CONTAINER_ID" -o json \
            | jq -r '(.secret_environment_variables // []) | length')"
          echo "after: $n secret(s)"
          fails=0
          [ "$n" = 4 ] || { echo "::error::expected 4 secrets, found $n"; fails=$((fails+1)); }

          get() { curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$@" || echo 000; }
          # The catalogue reads the database, so a 200 here proves DATABASE_URL
          # came back, not merely that Django booted.
          for path in / /accounts/login/; do
            for _ in 1 2 3; do
              c="$(get "$BASE$path")"; [ "$c" = 200 ] && break; sleep 5
            done
            if [ "$c" = 200 ]; then printf '  OK   GET %-18s -> %s\n' "$path" "$c"
            else printf '  FAIL GET %-18s -> %s\n' "$path" "$c"; fails=$((fails+1)); fi
          done

          body='{"jsonrpc":"2.0","id":1,"method":"ping"}'
          for _ in 1 2 3; do
            c="$(get -X POST "$BASE/mcp" -H 'Content-Type: application/json' \
              -H "X-API-Key: $TOKEN" -d "$body")"
            [ "$c" = 200 ] && break; sleep 5
          done
          if [ "$c" = 200 ]; then echo "  OK   POST /mcp with the key -> $c"
          else echo "  FAIL POST /mcp with the key -> $c"; fails=$((fails+1)); fi

          [ "$fails" -eq 0 ] || { echo "::error::$fails check(s) failed"; exit 1; }
          echo "### Container secrets restored" >> "$GITHUB_STEP_SUMMARY"
          echo "All four secrets present; site and /mcp verified." >> "$GITHUB_STEP_SUMMARY"
