# Manual diagnostic: what certificate do the production hostnames actually
# serve, seen from outside Render? Run from the Actions tab (workflow_dispatch).
name: TLS check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DNS and certificates
        run: |
          echo "--- CAA esljparents.eu"; dig +short CAA esljparents.eu; echo "(end CAA)"
          for h in esljparents.eu www.esljparents.eu extralessons-web.onrender.com; do
            echo
            echo "=================== $h"
            echo "--- DNS"; dig +short A "$h"; dig +short CNAME "$h"
            echo "--- handshake"
            echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>&1 \
              | grep -E "subject=|issuer=|Verify return|verify error|alert|error|CONNECTED" || true
            echo "--- certificate"
            echo | timeout 20 openssl s_client -connect "$h:443" -servername "$h" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>&1 || echo "no certificate parsed"
            echo "--- https"
            curl -sS -o /dev/null -m 20 -w "http=%{http_code} redirect=%{redirect_url} ssl_verify=%{ssl_verify_result}\n" "https://$h/" 2>&1 || true
            echo "--- http"
            curl -sS -o /dev/null -m 20 -w "http=%{http_code} redirect=%{redirect_url}\n" "http://$h/" 2>&1 || true
          done
