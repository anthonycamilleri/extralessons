name: Deploy to Scaleway

# Build once, migrate, then roll the container. The image is tagged with the
# commit SHA rather than a moving `latest`: Serverless Containers redeploy on a
# changed image reference, so an immutable tag is what makes a deploy
# deterministic and a rollback a one-line change.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to roll back to (skips the build)"
        required: false
        type: string

# Never let two deploys interleave: migrations are not safe to run twice
# concurrently, and the second container update would race the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SCW_REGION: fr-par
  REGISTRY_HOST: rg.fr-par.scw.cloud
  IMAGE_NAME: extralessons

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration is present
        # Failing here with a readable message beats a cryptic 404 from the API
        # halfway through a deploy. See docs/scaleway-setup.md.
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_REGISTRY_NAMESPACE: ${{ vars.SCW_REGISTRY_NAMESPACE }}
          SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
          SCW_JOB_MIGRATE_ID: ${{ vars.SCW_JOB_MIGRATE_ID }}
          SCW_JOB_NOTIFIER_ID: ${{ vars.SCW_JOB_NOTIFIER_ID }}
        run: |
          missing=""
          for name in SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID \
                      SCW_REGISTRY_NAMESPACE SCW_CONTAINER_ID \
                      SCW_JOB_MIGRATE_ID SCW_JOB_NOTIFIER_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets/variables:$missing"
            echo "Run through docs/scaleway-setup.md, then set them under"
            echo "Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Resolve image reference
        id: image
        run: |
          tag="${{ inputs.image_tag || github.sha }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY_HOST}/${{ vars.SCW_REGISTRY_NAMESPACE }}/${IMAGE_NAME}:${tag}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${REGISTRY_HOST}/${{ vars.SCW_REGISTRY_NAMESPACE }}/${IMAGE_NAME}:${tag}"

      - uses: docker/setup-buildx-action@v3
        if: ${{ !inputs.image_tag }}

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          # The registry takes the API secret key as the password; the username
          # is the literal string "nologin".
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build and push
        if: ${{ !inputs.image_tag }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          # Scaleway Serverless rejects anything that is not linux/amd64.
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY_HOST }}/${{ vars.SCW_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install the Scaleway CLI
        run: curl -sS https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sudo sh

      - name: Run migrations
        # Migrations run as their own Job, once, before the new image serves
        # traffic — never from the container's start command, where every
        # cold-started instance would race every other one.
        #
        # This ordering assumes additive migrations, which is the normal Django
        # case. A destructive migration needs the usual two-deploy dance:
        # ship the code that tolerates both shapes first, drop the column after.
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          scw jobs definition update "${{ vars.SCW_JOB_MIGRATE_ID }}" \
            image-uri="$IMAGE_REF" -o json > /dev/null

          # The response is {"job_runs":[{...}]}, not a bare run object, so the
          # id lives one level down. Reading `.id` here yields null and the
          # `jobs run wait` that follows fails on a malformed UUID.
          run_id=$(scw jobs definition start "${{ vars.SCW_JOB_MIGRATE_ID }}" -o json \
            | jq -r '.job_runs[0].id // .id')
          echo "Migration run: $run_id"

          # `wait` blocks until the run reaches a stable state; it is not the
          # authority on which state that was, so read it back explicitly.
          scw jobs run wait "$run_id" > /dev/null 2>&1 || true
          scw jobs run get "$run_id" -o json > /tmp/run.json
          state=$(jq -r '.state // "unknown"' /tmp/run.json)
          echo "Final state: $state"

          if [ "$state" != "succeeded" ]; then
            echo "::error::Migration job finished in state '$state' — not deploying."
            jq . /tmp/run.json
            echo "Logs: scw jobs run get $run_id, or Cockpit."
            exit 1
          fi

      - name: Point the notifier job at the new image
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          scw jobs definition update "${{ vars.SCW_JOB_NOTIFIER_ID }}" \
            image-uri="$IMAGE_REF" -o json > /dev/null
          echo "Notifier job will use $IMAGE_REF on its next scheduled run."

      - name: Deploy the container
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
          SCW_DEFAULT_REGION: ${{ env.SCW_REGION }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          set -euo pipefail
          # Updating the image reference is what triggers the redeploy.
          # The argument is `image=`; the older `registry-image=` was removed
          # from the CLI and is now rejected as an unknown argument.
          scw container container update "${{ vars.SCW_CONTAINER_ID }}" \
            image="$IMAGE_REF" -o json > /dev/null

          # The container reports the *previous* deployment as ready for a
          # moment after the update lands, so settle before believing a status.
          sleep 10

          for attempt in $(seq 1 60); do
            json=$(scw container container get "${{ vars.SCW_CONTAINER_ID }}" -o json)
            status=$(echo "$json" | jq -r '.status')
            # The API has carried this field under both names; accept either
            # so a CLI upgrade cannot make the readiness check silently
            # compare against "null" and time out after five minutes.
            image=$(echo "$json" | jq -r '.image // .registry_image // "unknown"')
            echo "attempt $attempt: status=$status image=$image"

            if [ "$status" = "ready" ] && [ "$image" = "$IMAGE_REF" ]; then
              echo "Deployed $IMAGE_REF"
              exit 0
            fi
            if [ "$status" = "error" ]; then
              echo "::error::Container entered error state: $(echo "$json" | jq -r '.error_message')"
              exit 1
            fi
            sleep 5
          done
          echo "::error::Container did not become ready within 5 minutes."
          exit 1

      - name: Smoke test
        if: ${{ vars.APP_URL != '' }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.APP_URL }}/_health" || true)
            [ "$code" = "200" ] && { echo "health ok"; exit 0; }
            echo "attempt $attempt: HTTP $code"
            sleep 5
          done
          echo "::error::${{ vars.APP_URL }}/_health never returned 200."
          exit 1
