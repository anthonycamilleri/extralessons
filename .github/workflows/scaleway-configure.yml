name: "Scaleway: configure the estate"

# Brings the existing Scaleway estate (web container, migrate job, notifier
# job) up to the production configuration this repository expects, and is the
# place to change the container's min-scale from GitHub.
#
# Nothing is typed in and no human handles a secret. Everything comes from the
# estate itself, exactly as deploy.yml reads it on every deploy:
#
#   SECRET_KEY, DATABASE_URL   plain variables on the migrate job
#   EMAIL_HOST_PASSWORD        the SCW_MAIL_SECRET_KEY GitHub secret
#   MCP_API_TOKEN              the MCP_API_TOKEN GitHub secret (absent = the
#                              /mcp endpoint is switched off)
#   ADMIN_EMAIL, DEFAULT_FROM_EMAIL, TIME_ZONE, DB_POOL_MAX_SIZE
#                              read back from the container's plain variables
#
# Email itself is Scaleway Transactional Email: the password comes from the
# SCW_MAIL_SECRET_KEY secret and the rest from deploy/scaleway-env.lib.sh.
#
# Idempotent — run it as often as the configuration changes. The environment
# is described once, in deploy/scaleway-env.lib.sh, and applied identically to
# the container and both jobs. Every secret is masked in the log.
#
# Run with dry_run (the default) first: it prints what it would set and changes
# nothing. Then run it again with dry_run unticked. A container update
# redeploys it: one cold start, one idle window of billing.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show the configuration that would be applied"
        type: boolean
        default: true
      domain:
        description: "Public hostname parents use (sets SITE_URL)"
        type: string
        default: www.esljparents.eu
      apex_domain:
        description: "Bare domain to accept alongside (empty = none)"
        type: string
        default: esljparents.eu
      min_scale:
        description: "Container min-scale (empty = leave as is; 0 = sleep when idle; 1 = always warm, billed around the clock)"
        type: string
        default: ""
  # A push that touches this file only registers the workflow with GitHub so
  # it can be dispatched; the job below refuses to run on it.
  push:
    paths: [".github/workflows/scaleway-configure.yml"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: fr-par
      CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
      JOB_MIGRATE_ID: ${{ vars.SCW_JOB_MIGRATE_ID }}
      JOB_NOTIFIER_ID: ${{ vars.SCW_JOB_NOTIFIER_ID }}
      EMAIL_HOST_USER: ${{ vars.SCW_MAIL_PROJECT_ID || secrets.SCW_DEFAULT_PROJECT_ID }}
      EMAIL_HOST_PASSWORD: ${{ secrets.SCW_MAIL_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required configuration is present
        run: |
          missing=""
          for n in SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID \
                   CONTAINER_ID JOB_MIGRATE_ID JOB_NOTIFIER_ID EMAIL_HOST_PASSWORD; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          [ -z "$missing" ] || { echo "::error::Missing secrets/variables:$missing"; exit 1; }

      - name: Install the Scaleway CLI
        run: curl -sS https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | sudo sh

      - name: Read what the Scaleway estate already has
        id: scw
        run: |
          set -euo pipefail
          # The application secrets live only on Scaleway: as secrets on the
          # container (unreadable) and as plain variables on the jobs.
          job="$(scw jobs definition get "$JOB_MIGRATE_ID" -o json)"
          for k in SECRET_KEY DATABASE_URL; do
            v="$(jq -r --arg k "$k" '.environment_variables[$k] // empty' <<<"$job")"
            [ -n "$v" ] || { echo "::error::the migrate job carries no $k"; exit 1; }
            echo "::add-mask::$v"
            echo "$k=$v" >> "$GITHUB_OUTPUT"
            echo "read $k from the migrate job (${#v} characters)"
          done
          cjson="$(scw container container get "$CONTAINER_ID" -o json)"
          host="$(jq -r '(.public_endpoint // .domain_name // "") | sub("^https?://";"")' <<<"$cjson")"
          [ -n "$host" ] || { echo "::error::container has no endpoint yet"; exit 1; }
          echo "GENERATED_HOST=$host" >> "$GITHUB_OUTPUT"
          # The plain settings that are not derived from anything else: keep
          # whatever the container has, so this run changes only what it says.
          for k in ADMIN_EMAIL DEFAULT_FROM_EMAIL TIME_ZONE DB_POOL_MAX_SIZE; do
            v="$(jq -r --arg k "$k" '.environment_variables[$k] // empty' <<<"$cjson")"
            echo "$k=$v" >> "$GITHUB_OUTPUT"; echo "read $k = ${v:-<unset, default applies>}"
          done
          echo "container endpoint: $host"
          echo "container status:   $(jq -r .status <<<"$cjson"), scale $(jq -r .min_scale <<<"$cjson")..$(jq -r .max_scale <<<"$cjson"), image $(jq -r '.registry_image // .image' <<<"$cjson")"
          echo "plain env keys now: $(jq -r '.environment_variables | keys | join(",")' <<<"$cjson")"

      - name: Apply the production configuration
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DOMAIN: ${{ inputs.domain }}
          APEX_DOMAIN: ${{ inputs.apex_domain }}
          MIN_SCALE: ${{ inputs.min_scale }}
          GENERATED_HOST: ${{ steps.scw.outputs.GENERATED_HOST }}
          DATABASE_URL: ${{ steps.scw.outputs.DATABASE_URL }}
          SECRET_KEY: ${{ steps.scw.outputs.SECRET_KEY }}
          MCP_API_TOKEN: ${{ secrets.MCP_API_TOKEN }}
          ADMIN_EMAIL: ${{ steps.scw.outputs.ADMIN_EMAIL }}
          DEFAULT_FROM_EMAIL: ${{ steps.scw.outputs.DEFAULT_FROM_EMAIL }}
          TIME_ZONE: ${{ steps.scw.outputs.TIME_ZONE }}
          DB_POOL_MAX_SIZE: ${{ steps.scw.outputs.DB_POOL_MAX_SIZE }}
        run: |
          set -euo pipefail
          [ -n "$DEFAULT_FROM_EMAIL" ] || { echo "::error::the container has no DEFAULT_FROM_EMAIL to keep; set it in deploy/scaleway.env and run provision.sh"; exit 1; }
          [ -n "$MCP_API_TOKEN" ] || echo "::warning::MCP_API_TOKEN secret is not set: the /mcp connector endpoint will be off after this run."
          . deploy/scaleway-env.lib.sh
          scw_host_settings
          scw_plain_env; scw_container_secrets; scw_job_env
          scale=(); [ -n "$MIN_SCALE" ] && scale=(min-scale="$MIN_SCALE")

          echo "## container $CONTAINER_ID"
          printf '  %s\n' "${PLAIN_ENV[@]}" "${scale[@]}"
          printf '  %s\n' "${CONTAINER_SECRETS[@]}" | sed -E 's/=.*/=<secret>/'
          echo "## jobs $JOB_MIGRATE_ID, $JOB_NOTIFIER_ID"
          printf '  %s\n' "${JOB_ENV[@]}" | sed -E 's/^(environment-variables\.(SECRET_KEY|DATABASE_URL|EMAIL_HOST_PASSWORD))=.*/\1=<secret>/'

          if [ "$DRY_RUN" = "true" ]; then
            echo; echo "Dry run: nothing changed. Re-run with dry_run unticked to apply."
            exit 0
          fi

          scw container container update "$CONTAINER_ID" \
            "${PLAIN_ENV[@]}" "${CONTAINER_SECRETS[@]}" "${scale[@]}" -o json > /dev/null
          echo "container updated; redeploying"
          scw jobs definition update "$JOB_MIGRATE_ID"  "${JOB_ENV[@]}" -o json > /dev/null
          scw jobs definition update "$JOB_NOTIFIER_ID" "${JOB_ENV[@]}" -o json > /dev/null
          echo "jobs updated"

          # An environment change redeploys the container; wait for it.
          sleep 10
          for attempt in $(seq 1 60); do
            status="$(scw container container get "$CONTAINER_ID" -o json | jq -r .status)"
            echo "attempt $attempt: $status"
            [ "$status" = "ready" ] && break
            [ "$status" = "error" ] && { echo "::error::container in error"; exit 1; }
            sleep 5
          done
          [ "$status" = "ready" ] || { echo "::error::container not ready after five minutes"; exit 1; }

      - name: Smoke test the generated endpoint
        if: ${{ !inputs.dry_run }}
        run: deploy/smoke.sh "https://${{ steps.scw.outputs.GENERATED_HOST }}"
