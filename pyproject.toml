[project]
name = "extralessons"
version = "0.1.0"
description = "Booking system for school extra-curricular activities"
requires-python = ">=3.11"
dependencies = [
    "django~=5.2",
    "psycopg[binary,pool]~=3.2",
    "gunicorn~=23.0",
    "whitenoise~=6.8",
    "Pillow~=12.3",
    "django-environ~=0.12",
    "requests~=2.32",
    # Renders the admin-edited Terms & Conditions (apps.accounts.SiteConfig).
    "markdown~=3.7",
    "django-storages[s3]~=1.14",
    # The MCP SDK ships in the runtime image: the web service serves the
    # catalogue tools at /mcp (apps.catalog.mcp_http) as well as over stdio.
    "mcp>=1.29,<2",
]

[project.optional-dependencies]
dev = [
    "pytest-django~=4.9",
    "factory-boy~=3.3",
]
# Kept for older instructions; the SDK is now a core dependency.
mcp = []

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# This pyproject is used for dependency management only — the Django project
# is run from the source tree, never imported as an installed package.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--tb=short"
